# docker-compose.prod.yml
# Production override — enables HTTPS via Let's Encrypt.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Before first run:
#   DOMAIN=yourdomain.com EMAIL=you@example.com ./scripts/init-letsencrypt.sh

services:
  frontend:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.ssl.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    # Reload nginx every 6 hours to pick up renewed certs
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  certbot:
    image: certbot/certbot:latest
    container_name: bace-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Attempt renewal every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - bace-network

  backend:
    # In production, backend is only reachable via Docker network (nginx proxies /api)
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    environment:
      CORS_ORIGINS: "https://${DOMAIN:-localhost}"
      VITE_API_URL: "https://${DOMAIN:-localhost}"
